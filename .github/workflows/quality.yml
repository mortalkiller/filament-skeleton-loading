name: Code quality

on:
  pull_request:
  push:
    branches: ['*.x']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-quality.yml@03e45bebb4be1b76b6fa25c77a9e6f8a2c86c84f
    with:
      php-version: '8.4'
      static-analysis: true
