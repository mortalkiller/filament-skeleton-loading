name: Package tests

on:
  pull_request:
  push:
    branches: ['*.x']
  # Weekly run against the latest Filament releases: the package styles Filament's own
  # loading markup, which can change in a minor release without a change here.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-tests.yml@03e45bebb4be1b76b6fa25c77a9e6f8a2c86c84f
    with:
      matrix-json: >-
        {"include":[
          {"php":"8.3","laravel":"12.*","testbench":"^10.0","filament_package":"filament/filament","filament":"4.15.2","dependencies":"lowest","expected_filament":"4.15.2"},
          {"php":"8.4","laravel":"13.*","testbench":"^11.0","filament_package":"filament/filament","filament":"^4.15.2","dependencies":"latest"},
          {"php":"8.5","laravel":"13.*","testbench":"^11.0","filament_package":"filament/filament","filament":"^4.15.2","dependencies":"latest"},
          {"php":"8.3","laravel":"12.*","testbench":"^10.0","filament_package":"filament/filament","filament":"5.10.2","dependencies":"lowest","expected_filament":"5.10.2"},
          {"php":"8.4","laravel":"13.*","testbench":"^11.0","filament_package":"filament/filament","filament":"^5.10.2","dependencies":"latest"},
          {"php":"8.5","laravel":"13.*","testbench":"^11.0","filament_package":"filament/filament","filament":"^5.10.2","dependencies":"latest"}
        ]}
      test-command: composer test

  skills:
    name: Package standard skill distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.composer/cache/files
          key: composer-skill-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-skill-

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify developing-filament-packages distribution
        shell: bash
        run: |
          test -f vendor/mortalkiller/filament-package-standard/resources/boost/skills/developing-filament-packages/SKILL.md
          grep -F 'name: developing-filament-packages' vendor/mortalkiller/filament-package-standard/resources/boost/skills/developing-filament-packages/SKILL.md
